{% from '_icons.html' import icon %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Log in · AgriSense</title>
<link rel="icon" href="{{ url_for('static', filename='images/ffhnas.jpg') }}">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@600;700&display=swap" rel="stylesheet"/>
<style>
:root {
  --green: #2d9d5c; --green-dark: #247f4a; --green-soft: rgba(45,157,92,.10);
  --ink: #1c2b21; --muted: #5f7367; --line: #dbe3dd; --bg: #ffffff;
}
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: 'DM Sans', system-ui, sans-serif; color: var(--ink); background: var(--bg);
  display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }

.split { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(360px, 34%); }

/* ───── left: brand + picture ───── */
.left { position: relative; padding: 48px 56px 56px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--ink); position: relative; z-index: 2; }
.brand img { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 2px var(--green); }
.brand b { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 700; }
.headline { position: relative; z-index: 2; font-size: clamp(36px, 4.2vw, 60px); line-height: 1.06; font-weight: 700; letter-spacing: -.02em; max-width: 7em; }
.headline em { font-style: normal; color: var(--green); white-space: nowrap; }

.stage { position: absolute; z-index: 1; right: 4%; top: 50%; transform: translateY(-50%); width: min(40%, 480px); aspect-ratio: 4 / 5; }
.photo { position: absolute; inset: 0; border-radius: 30px; overflow: hidden;
  box-shadow: 0 18px 50px rgba(20,50,30,.22), 0 0 0 1px rgba(0,0,0,.04); }
.photo img { width: 100%; height: 100%; object-fit: cover; object-position: 38% 50%; display: block; transform: scale(1.12); transform-origin: 50% 0; }
.chip { position: absolute; z-index: 3; display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 999px;
  background: #fff; box-shadow: 0 8px 26px rgba(20,50,30,.18); font-size: 13px; font-weight: 600; white-space: nowrap; }
.chip i { width: 9px; height: 9px; border-radius: 50%; background: var(--green); display: block; }
.chip-a { left: -64px; top: 13%; }
.chip-b { right: -26px; bottom: 15%; }
.badge { position: absolute; z-index: 3; left: -44px; bottom: 5%; width: 92px; height: 92px; border-radius: 50%; border: 4px solid var(--green);
  background: #fff url("{{ url_for('static', filename='images/ffhnas.jpg') }}") center/cover; box-shadow: 0 10px 30px rgba(20,50,30,.25); }

/* ───── right: form ───── */
.right { border-left: 1px solid var(--line); display: flex; align-items: center; justify-content: center; padding: 40px 36px; }
.form-wrap { width: 100%; max-width: 480px; }
.form-wrap h1 { font-size: 19px; font-weight: 600; margin-bottom: 28px; }
.err { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; padding: 11px 14px; border-radius: 12px;
  font-size: 13px; line-height: 1.4; color: #c0392b; background: #fdecea; border: 1px solid #f5c2bc; }
.field { margin-bottom: 14px; position: relative; }
.field input { width: 100%; height: 58px; padding: 0 22px; font: inherit; font-size: 16px; color: var(--ink); background: #fff;
  border: 1px solid #cfd8d2; border-radius: 18px; outline: none; transition: border-color .15s, box-shadow .15s; }
.field input::placeholder { color: var(--muted); }
.field input:focus { border-color: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
.field.pw input { padding-right: 56px; }
.eye { position: absolute; top: 50%; right: 12px; transform: translateY(-50%); width: 38px; height: 38px; border: none; background: transparent;
  color: var(--muted); border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; -webkit-tap-highlight-color: transparent; }
.eye:hover { color: var(--green); background: var(--green-soft); }
.eye .off { display: none; } .eye.on .open { display: none; } .eye.on .off { display: block; }
.btn { display: flex; align-items: center; justify-content: center; width: 100%; height: 52px; border-radius: 999px; font: inherit; font-size: 16px; font-weight: 600;
  cursor: pointer; text-decoration: none; transition: background .15s, transform .05s, border-color .15s; }
.btn:active { transform: scale(.985); }
.btn-primary { margin-top: 10px; border: none; background: var(--green); color: #fff; }
.btn-primary:hover { background: var(--green-dark); }
.btn-primary:disabled { opacity: .65; cursor: default; }
.btn-ghost { border: 1.5px solid var(--green); background: transparent; color: var(--green-dark); }
.btn-ghost:hover { background: var(--green-soft); }
.gap { height: 64px; }
.tagline { margin-top: 28px; text-align: center; font-size: 14px; font-weight: 600; color: var(--ink); display: flex; align-items: center; justify-content: center; gap: 8px; }
.tagline img { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; }

/* ───── footer ───── */
.foot { border-top: 3px solid #e9eeea; padding: 22px 24px calc(22px + env(safe-area-inset-bottom)); text-align: center; font-size: 13px; color: var(--muted); }

/* ───── tablet / phone: picture on top, form below ───── */
@media (max-width: 960px) {
  .split { grid-template-columns: 1fr; }
  .left { padding: calc(22px + env(safe-area-inset-top)) 22px 8px; min-height: 0; gap: 18px; justify-content: flex-start; }
  .brand img { width: 44px; height: 44px; }
  .stage { position: relative; right: auto; top: auto; transform: none; width: 100%; aspect-ratio: 16 / 10; order: 2; }
  .photo { border-radius: 22px; }
  .headline { order: 3; max-width: none; font-size: clamp(30px, 8vw, 44px); }
  .chip, .badge { display: none; }
  .right { border-left: none; padding: 20px 22px 32px; }
  .gap { height: 30px; }
}
</style>
</head>
<body>
<div class="split">
  <section class="left" aria-label="AgriSense">
    <a class="brand" href="{{ url_for('login') }}">
      <img src="{{ url_for('static', filename='images/ffhnas.jpg') }}" alt="AgriSense logo"/>
      <b>AgriSense</b>
    </a>

    <div class="stage">
      <div class="photo"><img src="{{ url_for('static', filename='images/bgschool.jpg') }}" alt="Our school"/></div>
      <div class="chip chip-a"><i></i> pH 6.4 &middot; Optimal</div>
      <div class="chip chip-b"><i></i> Soil health 82 / 100</div>
      <div class="badge" aria-hidden="true"></div>
    </div>

    <h2 class="headline">Understand<br>your soil,<br><em>grow what<br>you love.</em></h2>
  </section>

  <section class="right">
    <div class="form-wrap">
      <h1>Log into AgriSense</h1>
      <form method="POST" id="loginForm">
        {% if error %}
        <div class="err" id="loginErr">{{ icon('alert',16) }} {{ error }}</div>
        {% endif %}
        <div class="field">
          <input type="text" name="username" placeholder="Username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next" value="{{ request.form.get('username','') }}" required/>
        </div>
        <div class="field pw">
          <input type="password" name="password" placeholder="Password" autocomplete="current-password" enterkeyhint="go" required/>
          <button type="button" class="eye" id="pwEye" aria-label="Show password" title="Show password">
            <svg class="open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
        <button class="btn btn-primary" type="submit" id="loginBtn">Log in</button>
      </form>

      <div class="gap"></div>
      <a class="btn btn-ghost" href="{{ url_for('register') }}">Create new account</a>
      <div class="tagline"><img src="{{ url_for('static', filename='images/ffhnas.jpg') }}" alt=""/> AgriSense</div>
    </div>
  </section>
</div>

<footer class="foot">AgriSense &middot; Soil Monitoring Platform</footer>

<script>
(function () {
  var form = document.getElementById('loginForm'), btn = document.getElementById('loginBtn');
  var pass = form.querySelector('input[name="password"]'), eye = document.getElementById('pwEye');

  // show / hide password
  eye.addEventListener('click', function () {
    var show = pass.type === 'password'; pass.type = show ? 'text' : 'password';
    eye.classList.toggle('on', show);
    var l = show ? 'Hide password' : 'Show password'; eye.setAttribute('aria-label', l); eye.title = l; pass.focus();
  });

  // sign in without leaving a login entry in history, so Back never returns here
  if (!window.fetch) return;
  form.addEventListener('submit', function (e) {
    e.preventDefault(); btn.disabled = true;
    fetch(location.pathname, { method: 'POST', body: new FormData(form), credentials: 'same-origin', headers: { 'X-Requested-With': 'fetch' } })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (x) {
        if (x.ok && x.d.redirect) { location.replace(x.d.redirect); return; }
        var box = document.getElementById('loginErr');
        if (!box) { box = document.createElement('div'); box.id = 'loginErr'; box.className = 'err'; form.insertBefore(box, form.firstChild); }
        box.textContent = x.d.error || 'Sign in failed.'; btn.disabled = false;
      })
      .catch(function () { form.submit(); });
  });
})();
</script>
</body>
</html>
